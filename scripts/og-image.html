<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Arko · Imagen social</title>
    <style>
      @font-face {
        font-family: "Hina Mincho";
        src: url("../public/fonts/hina-mincho-400.woff2") format("woff2");
      }

      @font-face {
        font-family: "Zen Kaku Gothic New";
        src: url("../public/fonts/zen-kaku-gothic-new-400.woff2") format("woff2");
      }

      @font-face {
        font-family: "Zen Kaku Gothic New";
        src: url("../public/fonts/zen-kaku-gothic-new-700.woff2") format("woff2");
        font-weight: 700;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #131209;
        color: #f3eadb;
        font-family: "Zen Kaku Gothic New", sans-serif;
      }

      .brand {
        position: absolute;
        top: 52px;
        left: 64px;
        width: 212px;
        height: 57px;
        filter: invert(91%) sepia(14%) saturate(398%) hue-rotate(326deg) brightness(105%) contrast(91%);
      }

      .eyebrow {
        position: absolute;
        top: 203px;
        left: 64px;
        margin: 0;
        color: #d0703a;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 2.4px;
        text-transform: uppercase;
      }

      h1 {
        position: absolute;
        top: 235px;
        left: 62px;
        width: 690px;
        margin: 0;
        font-family: "Hina Mincho", serif;
        font-size: 69px;
        font-weight: 400;
        letter-spacing: 0.2px;
        line-height: 1.09;
      }

      h1 span { display: block; }

      .footer {
        position: absolute;
        left: 64px;
        bottom: 52px;
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 0;
        color: #f3eadb;
        font-size: 20px;
        letter-spacing: 0.2px;
      }

      .footer::before {
        display: block;
        width: 30px;
        height: 2px;
        background: #d0703a;
        content: "";
      }

      .arch {
        position: absolute;
        top: 26px;
        right: 28px;
        width: 402px;
        height: 578px;
        overflow: hidden;
        border: 1px solid #685d49;
        border-radius: 201px 201px 0 0;
        background: #493622;
      }

      .arch img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 45%;
      }
    </style>
  </head>
  <body>
    <img class="brand" src="../src/assets/arko/logo.svg" alt="Arko" />
    <p class="eyebrow">Cocina nikkei en el Eixample</p>
    <h1><span>Cocina japonesa</span><span>con alma</span><span>mediterránea</span></h1>
    <p class="footer">Enric Granados 63 · Barcelona</p>
    <div class="arch">
      <img src="../src/assets/arko/paradas/0-entrada.jpg" alt="Entrada de Arko con un cerezo en flor" />
    </div>
  </body>
</html>
